<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Регистрация - Генератор учебных проектов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0e27;
            background-image: url('/static/land.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #e0e6ed;
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: -1;
        }
        
        .login-container {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid rgba(118, 75, 162, 0.3);
            width: 100%;
            max-width: 450px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header h1 {
            font-size: 2rem;
            color: #64ffda;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: #b8c5d6;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #b8c5d6;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid rgba(118, 75, 162, 0.4);
            border-radius: 8px;
            font-size: 1.1rem;
            min-height: 3rem;
            transition: border-color 0.3s, background 0.3s;
            font-family: inherit;
            background: rgba(20, 25, 50, 0.6);
            color: #e0e6ed;
        }
        
        input:focus {
            outline: none;
            border-color: #64ffda;
            background: rgba(20, 25, 50, 0.8);
        }
        
        .btn {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.4);
            background: linear-gradient(135deg, #64ffda 0%, #764ba2 100%);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-msg {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #f87171;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .error-msg.show {
            display: block;
        }
        
        .field-error {
            border-color: #f44336 !important;
            background: rgba(244, 67, 54, 0.1) !important;
        }
        
        .error-message {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: block;
            padding: 0.25rem 0.5rem;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 4px;
            border-left: 3px solid #f44336;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .field-error {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>📝 Регистрация</h1>
            <p>Создайте новый аккаунт</p>
        </div>
        
        <div id="errorMsg" class="error-msg"></div>
        
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    autocomplete="email"
                    placeholder="Введите ваш email"
                    aria-required="true"
                    aria-invalid="false"
                    aria-describedby="email-error"
                >
                <span id="email-error" class="error-message" role="alert" aria-live="polite" style="display: none;"></span>
            </div>
            
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    minlength="3"
                    maxlength="100"
                    autocomplete="username"
                    placeholder="Введите имя пользователя"
                    aria-required="true"
                    aria-invalid="false"
                    aria-describedby="username-error"
                >
                <span id="username-error" class="error-message" role="alert" aria-live="polite" style="display: none;"></span>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Введите пароль (минимум 8 символов)"
                    aria-required="true"
                    aria-invalid="false"
                    aria-describedby="password-error"
                >
                <span id="password-error" class="error-message" role="alert" aria-live="polite" style="display: none;"></span>
            </div>
            
            <button type="submit" class="btn" id="registerBtn">Зарегистрироваться</button>
            
            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="/" style="color: #64ffda; text-decoration: none; font-size: 0.9rem;">Уже есть аккаунт? Войти</a>
            </div>
        </form>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        const API_URL = `${API_BASE}/api/v1`;
        
        async function handleRegister(event) {
            event.preventDefault();
            
            const btn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('errorMsg');
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            // Валидация на клиенте
            let hasErrors = false;
            
            // Валидация email
            const emailError = document.getElementById('email-error');
            const emailField = document.getElementById('email');
            if (!email) {
                emailField.setAttribute('aria-invalid', 'true');
                emailField.classList.add('field-error');
                emailError.textContent = '❌ Пожалуйста, введите email';
                emailError.style.display = 'block';
                hasErrors = true;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailField.setAttribute('aria-invalid', 'true');
                emailField.classList.add('field-error');
                emailError.textContent = '❌ Введите корректный email адрес';
                emailError.style.display = 'block';
                hasErrors = true;
            } else {
                emailField.setAttribute('aria-invalid', 'false');
                emailField.classList.remove('field-error');
                emailError.textContent = '';
                emailError.style.display = 'none';
            }
            
            // Валидация username
            const usernameError = document.getElementById('username-error');
            const usernameField = document.getElementById('username');
            if (!username) {
                usernameField.setAttribute('aria-invalid', 'true');
                usernameField.classList.add('field-error');
                usernameError.textContent = '❌ Пожалуйста, введите имя пользователя';
                usernameError.style.display = 'block';
                hasErrors = true;
            } else if (username.length < 3) {
                usernameField.setAttribute('aria-invalid', 'true');
                usernameField.classList.add('field-error');
                usernameError.textContent = '❌ Имя пользователя должно содержать минимум 3 символа';
                usernameError.style.display = 'block';
                hasErrors = true;
            } else {
                usernameField.setAttribute('aria-invalid', 'false');
                usernameField.classList.remove('field-error');
                usernameError.textContent = '';
                usernameError.style.display = 'none';
            }
            
            // Валидация пароля
            const passwordError = document.getElementById('password-error');
            const passwordField = document.getElementById('password');
            if (!password) {
                passwordField.setAttribute('aria-invalid', 'true');
                passwordField.classList.add('field-error');
                passwordError.textContent = '❌ Пожалуйста, введите пароль';
                passwordError.style.display = 'block';
                hasErrors = true;
            } else if (password.length < 8) {
                passwordField.setAttribute('aria-invalid', 'true');
                passwordField.classList.add('field-error');
                passwordError.textContent = '❌ Пароль должен содержать минимум 8 символов';
                passwordError.style.display = 'block';
                hasErrors = true;
            } else {
                passwordField.setAttribute('aria-invalid', 'false');
                passwordField.classList.remove('field-error');
                passwordError.textContent = '';
                passwordError.style.display = 'none';
            }
            
            if (hasErrors) {
                return;
            }
            
            errorMsg.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Регистрация...';
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        username: username,
                        password: password
                    })
                });
                
                if (!response.ok) {
                    let errorDetail = 'Ошибка регистрации';
                    try {
                        const errorData = await response.json();
                        errorDetail = errorData.detail || errorData.message || `Ошибка ${response.status}`;
                    } catch (e) {
                        errorDetail = `Ошибка ${response.status}: ${response.statusText}`;
                    }
                    throw new Error(errorDetail);
                }
                
                const data = await response.json();
                showError(`✅ ${data.message || 'Регистрация успешна!'} Перенаправление на страницу входа...`, 'success');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                
            } catch (error) {
                console.error('Ошибка регистрации:', error);
                showError(`❌ ${error.message || 'Ошибка при регистрации. Попробуйте еще раз.'}`);
                btn.disabled = false;
                btn.textContent = 'Зарегистрироваться';
            }
        }
        
        function showError(message, type = 'error') {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
            if (type === 'success') {
                errorMsg.style.background = 'rgba(76, 175, 80, 0.2)';
                errorMsg.style.borderColor = 'rgba(76, 175, 80, 0.5)';
                errorMsg.style.color = '#4ade80';
            } else {
                errorMsg.style.background = 'rgba(220, 53, 69, 0.2)';
                errorMsg.style.borderColor = 'rgba(220, 53, 69, 0.5)';
                errorMsg.style.color = '#f87171';
            }
        }
    </script>
</body>
</html>
