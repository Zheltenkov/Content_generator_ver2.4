<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Вход - Генератор учебных проектов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0e27;
            background-image: url('/static/land.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #e0e6ed;
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: -1;
        }
        
        .login-container {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid rgba(118, 75, 162, 0.3);
            width: 100%;
            max-width: 450px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header h1 {
            font-size: 2rem;
            color: #64ffda;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: #b8c5d6;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #b8c5d6;
        }
        
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid rgba(118, 75, 162, 0.4);
            border-radius: 8px;
            font-size: 1.15rem;
            transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
            font-family: inherit;
            background: rgba(20, 25, 50, 0.8);
            color: #e0e6ed;
            line-height: 1.5;
        }
        
        input[type="email"]::placeholder {
            color: rgba(184, 197, 214, 0.6);
            font-size: 1rem;
        }
        
        input:focus {
            outline: none;
            border-color: #64ffda;
            background: rgba(20, 25, 50, 0.95);
            box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.15);
        }
        
        input:hover {
            border-color: rgba(118, 75, 162, 0.6);
            background: rgba(20, 25, 50, 0.85);
        }
        
        .btn {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.4);
            background: linear-gradient(135deg, #64ffda 0%, #764ba2 100%);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: rgba(118, 75, 162, 0.3);
            color: #64ffda;
            border: 2px solid rgba(100, 255, 218, 0.4);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .btn-secondary:hover {
            background: rgba(118, 75, 162, 0.5);
            border-color: #64ffda;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.3);
            text-decoration: none;
        }
        
        .error-msg {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #f87171;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .error-msg.show {
            display: block;
        }
        
        .info-box {
            background: rgba(33, 150, 243, 0.2);
            border-left: 4px solid #64ffda;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 4px;
            color: #b8c5d6;
            font-size: 0.9rem;
        }
        
        a {
            color: #64ffda;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        
        a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🎓 Школа 21</h1>
            <p>Генератор учебных проектов</p>
        </div>
        
        <div id="errorMsg" class="error-msg"></div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    autocomplete="email"
                    placeholder="Введите ваш email"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                    autocomplete="current-password"
                    placeholder="Введите пароль"
                >
            </div>
            
            <button type="submit" class="btn" id="loginBtn">Войти</button>
        </form>
        
        <!-- Кнопки регистрации и восстановления пароля -->
        <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center;">
            <a href="/register" class="btn-secondary" style="flex: 1;">
                📝 Регистрация
            </a>
            <a href="/forgot-password" class="btn-secondary" style="flex: 1;">
                🔑 Забыли пароль?
            </a>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        const API_URL = `${API_BASE}/api/v1`;
        
        // Проверяем, есть ли уже сохраненный токен
        const savedToken = localStorage.getItem('auth_token');
        if (savedToken) {
            // Если токен есть, перенаправляем на главную страницу
            // app.html сам проверит валидность токена и перенаправит обратно, если нужно
            window.location.replace('/app');
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            if (!emailInput) {
                showError('Поле email не найдено');
                return;
            }
            
            if (!passwordInput) {
                showError('Поле пароля не найдено');
                return;
            }
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email) {
                showError('Пожалуйста, введите email');
                return;
            }
            
            if (!password) {
                showError('Пожалуйста, введите пароль');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Вход...';
            errorMsg.classList.remove('show');
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                if (!response.ok) {
                    let errorDetail = 'Ошибка входа';
                    try {
                        const errorData = await response.json();
                        errorDetail = errorData.detail || errorData.message || `Ошибка ${response.status}`;
                        console.error('Ошибка от сервера:', errorData);
                    } catch (e) {
                        // Если не удалось распарсить JSON, используем статус
                        errorDetail = `Ошибка ${response.status}: ${response.statusText}`;
                        console.error('Не удалось распарсить ответ сервера:', e);
                    }
                    throw new Error(errorDetail);
                }
                
                const data = await response.json();
                console.log('Ответ от сервера:', data);
                
                // Проверяем, что данные получены
                if (!data || !data.access_token) {
                    console.error('Неполные данные от сервера:', data);
                    throw new Error('Не получен токен доступа от сервера');
                }
                
                // Сохраняем токен в localStorage
                try {
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id || '');
                    localStorage.setItem('username', data.username || email);
                    localStorage.setItem('email', email);
                    localStorage.setItem('session_id', (data.session_id || '').toString());
                    console.log('Данные сохранены в localStorage');
                } catch (storageError) {
                    console.error('Ошибка сохранения в localStorage:', storageError);
                    throw new Error('Не удалось сохранить данные авторизации. Проверьте настройки браузера.');
                }
                
                // Небольшая задержка перед перенаправлением для гарантии сохранения
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // Перенаправляем на главную страницу приложения
                // Используем replace вместо href, чтобы избежать проблем с историей
                console.log('Перенаправление на /app');
                window.location.replace('/app');
                
            } catch (error) {
                console.error('Ошибка входа:', error);
                let errorMessage = 'Ошибка при входе. Попробуйте еще раз.';
                
                if (error.message) {
                    errorMessage = error.message;
                } else if (error instanceof TypeError && error.message.includes('fetch')) {
                    errorMessage = 'Ошибка подключения к серверу. Проверьте, что сервер запущен.';
                } else if (error.name === 'NetworkError' || error.message.includes('Failed to fetch')) {
                    errorMessage = 'Не удалось подключиться к серверу. Проверьте подключение к интернету.';
                }
                
                showError(errorMessage);
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        }
        
        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = `❌ ${message}`;
            errorMsg.classList.add('show');
        }
    </script>
</body>
</html>
